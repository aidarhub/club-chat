plugins {
    id 'java'
    id("io.qameta.allure") version "$qameta_allure_version"
    id 'jacoco'
    id 'checkstyle'
    id 'maven-publish'
}

group 'my.important.job'
version '1.0'

ext {
    nexusUrl = System.getenv("NEXUS_URL") ?: project.findProperty("nexus_url")
    nexusUsername = System.getenv("NEXUS_USERNAME") ?: project.findProperty("nexus_user")
    nexusPassword = System.getenv("NEXUS_PASSWORD") ?: project.findProperty("nexus_password")

    junitJupiter = "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version"
    junitJunit5 = "org.junit.jupiter:junit-jupiter-engine:$allure_junit5_version"

    postgres = "org.postgresql:postgresql:$postgresql_version"
}

repositories {
    mavenCentral()
