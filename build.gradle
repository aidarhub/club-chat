}

dependencies {
    implementation 'org.eclipse.jetty:jetty-server:12.1.5'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.5'

    implementation 'org.glassfish.jersey.core:jersey-server:3.1.11'
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet-core:3.1.11'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.11'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.11'

    implementation 'ch.qos.logback:logback-classic:1.5.21'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.1'

    testImplementation "${junitJupiter}"
    testRuntimeOnly "${junitJupiter}"
    testImplementation "${junitJunit5}"
    implementation "${postgres}"
}

checkstyle {
    toolVersion='10.12.4'
    configFile = file("config/checkstyle/checkstyle.xml")
}

jacoco {
    toolVersion = "${jacoco_version}"
}

jacocoTestReport {
    reports {
        xml.required.set(false)
        html.required.set(true)
        csv.required.set(false)
    }
    dependsOn test
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
    dependsOn test
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            group group
            artifactId 'haydar_test'
            version version
        }
    }
    repositories {
        maven {
            allowInsecureProtocol = true
            url = version.endsWith("SNAPSHOT") ? "${nexusUrl}${nexus_maven_snapshots}" : "${nexusUrl}${nexus_maven_releases}"
            credentials {
                username nexusUsername
                password nexusPassword
            }
        }
    }
}